<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threat Detection Dashboard - Security Center</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(
          135deg,
          #0f0f23 0%,
          #1a1a2e 50%,
          #16213e 100%
        );
        color: #e5e7eb;
        min-height: 100vh;
        overflow-x: auto;
      }

      .dashboard-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
      }

      .header {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 30px;
        margin-bottom: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 32px;
        font-weight: 700;
        color: #60a5fa;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .header p {
        color: #9ca3af;
        font-size: 16px;
      }

      .status-indicator {
        display: inline-block;
        width: 12px;
        height: 12px;
        background: #10b981;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        transition: all 0.3s ease;
      }

      .stat-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .stat-number {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .stat-label {
        color: #9ca3af;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .blocked-count {
        color: #ef4444;
      }
      .active-count {
        color: #10b981;
      }
      .threat-count {
        color: #f59e0b;
      }

      .table-container {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 30px;
        overflow-x: auto;
      }

      .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 15px;
      }

      .table-title {
        font-size: 24px;
        font-weight: 600;
        color: #60a5fa;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .refresh-btn {
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .refresh-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 800px;
      }

      th,
      td {
        padding: 16px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      th {
        background: rgba(255, 255, 255, 0.1);
        color: #60a5fa;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 12px;
      }

      tr {
        transition: all 0.3s ease;
      }

      tr:hover {
        background: rgba(255, 255, 255, 0.05);
        transform: scale(1.01);
      }

      .blocked-row {
        background: rgba(239, 68, 68, 0.1);
        border-left: 4px solid #ef4444;
      }

      .unblocked-row {
        background: rgba(16, 185, 129, 0.1);
        border-left: 4px solid #10b981;
      }

      .prediction-badge {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .prediction-malicious {
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }

      .prediction-benign {
        background: rgba(16, 185, 129, 0.2);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      .confidence-bar {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        height: 8px;
        overflow: hidden;
        position: relative;
      }

      .confidence-fill {
        height: 100%;
        border-radius: 10px;
        transition: width 0.3s ease;
      }

      .confidence-high {
        background: linear-gradient(90deg, #ef4444, #dc2626);
      }
      .confidence-medium {
        background: linear-gradient(90deg, #f59e0b, #d97706);
      }
      .confidence-low {
        background: linear-gradient(90deg, #10b981, #059669);
      }

      .confidence-text {
        font-size: 12px;
        font-weight: 600;
        margin-top: 4px;
        text-align: center;
      }

      .action-btn {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .block-btn {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        color: white;
      }

      .block-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(239, 68, 68, 0.3);
      }

      .unblock-btn {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
      }

      .unblock-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
      }

      .ip-address {
        font-family: "Courier New", monospace;
        background: rgba(255, 255, 255, 0.1);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 13px;
      }

      .timestamp {
        color: #9ca3af;
        font-size: 13px;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #9ca3af;
      }

      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      .floating-action-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        background: red;
        border: none;
        border-radius: 50%;
        color: white;
        font-size: 0.75rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(238, 90, 82, 0.3);
        transition: all 0.3s ease;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        text-align: center;
        line-height: 1;
        animation: float 3s ease-in-out infinite;
      }

      .floating-action-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 12px 35px red;
        color: white;
        text-decoration: none;
      }

      .floating-action-btn:active {
        transform: scale(0.95);
      }

      .floating-action-btn:visited {
        color: white;
        text-decoration: none;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @media (max-width: 768px) {
        .floating-action-btn {
          width: 50px;
          height: 50px;
          font-size: 0.65rem;
          bottom: 20px;
          right: 20px;
        }
      }

      /* Responsive Design for the button */
      @media (max-width: 768px) {
        .floating-action-btn {
          width: 50px;
          height: 50px;
          font-size: 0.8rem;
          bottom: 20px;
          right: 20px;
        }
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        .dashboard-container {
          padding: 15px;
        }

        .header h1 {
          font-size: 24px;
        }

        .stats-grid {
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        .table-header {
          flex-direction: column;
          align-items: stretch;
        }

        th,
        td {
          padding: 12px 8px;
        }
      }

      input#searchInput {
        padding: 10px;
        border-radius: 8px;
        border: none;
        outline: none;
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <div class="header">
        <h1>
          🛡️ Threat Detection Dashboard
          <span class="status-indicator"></span>
        </h1>
        <p>Real-time security monitoring and threat analysis</p>
      </div>

      <a
        href="/monitor"
        class="floating-action-btn"
        title="Take Action - Go to Admin Dashboard"
      >
        Monitor <br />
      </a>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number blocked-count" id="blockedCount">0</div>
          <div class="stat-label">Blocked IPs</div>
        </div>
        <div class="stat-card">
          <div class="stat-number active-count" id="activeCount">0</div>
          <div class="stat-label">Active Sessions</div>
        </div>
        <div class="stat-card">
          <div class="stat-number threat-count" id="threatCount">0</div>
          <div class="stat-label">Threats Detected</div>
        </div>
      </div>

      <div class="table-container">
        <div class="table-header">
          <div class="table-title">📊 Live Security Logs</div>
          <input
            type="text"
            id="searchInput"
            placeholder="Search IP or Prediction..."
            oninput="filterLogs()"
          />
          <button class="refresh-btn" onclick="fetchLogs()">🔄 Refresh</button>
        </div>

        <table id="logTable">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Prediction</th>
              <th>Confidence</th>
              <th>IP Address</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="logTableBody">
            <tr>
              <td colspan="5" class="loading">
                <div class="spinner"></div>
                Loading security logs...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      let blockedIPs = [];
      let logData = [];

      async function fetchBlockedIPs() {
        try {
          const res = await fetch("/blocked_ips");
          blockedIPs = await res.json();
          updateStats();
        } catch (err) {
          console.error("Error fetching blocked IPs:", err);
        }
      }

      async function fetchLogs() {
        try {
          await fetchBlockedIPs();
          const res = await fetch("http://localhost:5000/logs");
          const data = await res.json();
          logData = data;

          const tbody = document.getElementById("logTableBody");
          tbody.innerHTML = "";

          if (data.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="5" class="loading">No logs available</td></tr>';
            return;
          }

          data.reverse().forEach((log) => {
            const isBlocked = blockedIPs.includes(log.user_ip);
            const rowClass = isBlocked ? "blocked-row" : "unblocked-row";
            const buttonLabel = isBlocked ? "Unblock" : "Block";
            const buttonClass = isBlocked ? "unblock-btn" : "block-btn";
            const actionFunc = isBlocked ? "unblockUser" : "blockUser";

            const confidence = (log.confidence * 100).toFixed(1);
            let predictionClass = "prediction-benign";
            if (log.prediction.toLowerCase() !== "normal") {
              predictionClass = "prediction-malicious";
            }

            let confidenceClass = "confidence-low";
            if (confidence >= 80) confidenceClass = "confidence-high";
            else if (confidence >= 60) confidenceClass = "confidence-medium";

            const row = document.createElement("tr");
            row.className = rowClass;

            // Highlight row border if prediction isn't normal
            if (log.prediction.toLowerCase() !== "normal") {
              row.style.border = "2px solid red";
            }

            row.innerHTML = `
            <td class="timestamp">${new Date(log.timestamp).toLocaleString(
              "en-US",
              {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
              }
            )}</td>
            <td><span class="prediction-badge ${predictionClass}">${
              log.prediction
            }</span></td>
            <td>
              <div class="confidence-bar">
                <div class="confidence-fill ${confidenceClass}" style="width: ${confidence}%"></div>
              </div>
              <div class="confidence-text">${confidence}%</div>
            </td>
            <td><span class="ip-address">${log.user_ip}</span></td>
            <td>
              <button class="action-btn ${buttonClass}" onclick="${actionFunc}('${
              log.user_ip
            }')">
                ${buttonLabel}
              </button>
            </td>
          `;
            tbody.appendChild(row);
          });

          updateStats();
          filterLogs(); // apply filter if user is searching
        } catch (err) {
          console.error("Error fetching logs:", err);
          document.getElementById("logTableBody").innerHTML =
            '<tr><td colspan="5" class="loading">Error loading logs</td></tr>';
        }
      }

      function updateStats() {
        const blockedCount = blockedIPs.length;
        const activeCount = logData.length - blockedCount;
        const threatCount = logData.filter(
          (log) => log.prediction.toLowerCase() !== "normal"
        ).length;

        document.getElementById("blockedCount").textContent = blockedCount;
        document.getElementById("activeCount").textContent = activeCount;
        document.getElementById("threatCount").textContent = threatCount;
      }

      async function blockUser(ip) {
        try {
          const res = await fetch(`http://localhost:5000/block_user/${ip}`, {
            method: "POST",
          });
          if (res.ok) {
            showNotification(`🚫 Blocked IP: ${ip}`, "success");
            fetchLogs();
          } else {
            showNotification("❌ Failed to block IP", "error");
          }
        } catch (err) {
          console.error("Error blocking user:", err);
          showNotification("❌ Error blocking user", "error");
        }
      }

      async function unblockUser(ip) {
        try {
          const res = await fetch(`http://localhost:5000/unblock_user/${ip}`, {
            method: "POST",
          });
          if (res.ok) {
            showNotification(`✅ Unblocked IP: ${ip}`, "success");
            fetchLogs();
          } else {
            showNotification("❌ Failed to unblock IP", "error");
          }
        } catch (err) {
          console.error("Error unblocking user:", err);
          showNotification("❌ Error unblocking user", "error");
        }
      }

      function showNotification(message, type) {
        const notification = document.createElement("div");
        notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 20px;
        border-radius: 8px;
        color: white;
        font-weight: 600;
        z-index: 1000;
        animation: slideIn 0.3s ease;
        background: ${
          type === "success"
            ? "linear-gradient(135deg, #10b981, #059669)"
            : "linear-gradient(135deg, #ef4444, #dc2626)"
        };
      `;
        notification.textContent = message;
        document.body.appendChild(notification);
        setTimeout(() => {
          notification.remove();
        }, 3000);
      }

      function filterLogs() {
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const rows = document.querySelectorAll("#logTableBody tr");

        rows.forEach((row) => {
          const ip = row
            .querySelector(".ip-address")
            ?.textContent.toLowerCase();
          const prediction = row
            .querySelector(".prediction-badge")
            ?.textContent.toLowerCase();
          if (ip?.includes(query) || prediction?.includes(query)) {
            row.style.display = "";
          } else {
            row.style.display = "none";
          }
        });
      }

      setInterval(fetchLogs, 3000);
      fetchLogs();
    </script>
  </body>
</html>
