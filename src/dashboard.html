<!DOCTYPE html>
<html>
  <head>
    <title>Threat Detection Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 8px;
        border: 1px solid #ccc;
        text-align: center;
      }
      th {
        background: #f5f5f5;
      }
      button {
        padding: 5px 10px;
        background-color: red;
        color: white;
        border: none;
        cursor: pointer;
      }
      .blocked-row {
        background-color: #ffcccc;
      }
      .unblocked-row {
        background-color: #ccffcc;
      }
      button.unblock {
        background-color: green;
      }
    </style>
  </head>
  <body>
    <h2>🛡️ Threat Detection Dashboard</h2>
    <p>Live Logs:</p>
    <table id="logTable">
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Prediction</th>
          <th>Confidence</th>
          <th>User IP</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
      let blockedIPs = [];

      async function fetchBlockedIPs() {
        try {
          const res = await fetch("/blocked_ips");
          blockedIPs = await res.json();
        } catch (err) {
          console.error("Error fetching blocked IPs:", err);
        }
      }

      async function fetchLogs() {
        try {
          await fetchBlockedIPs(); // update blockedIPs first

          const res = await fetch("/logs");
          const data = await res.json();

          const table = document.querySelector("#logTable tbody");
          table.innerHTML = "";

          data.reverse().forEach((log) => {
            const isBlocked = blockedIPs.includes(log.user_ip);
            const rowClass = isBlocked ? "blocked-row" : "unblocked-row";
            const buttonLabel = isBlocked ? "Unblock" : "Block";
            const buttonClass = isBlocked ? "unblock" : "";
            const actionFunc = isBlocked ? "unblockUser" : "blockUser";

            const row = `<tr class="${rowClass}">
          <td>${new Date(log.timestamp).toLocaleString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "numeric",
            minute: "numeric",
            second: "numeric",
          })}</td>
          <td>${log.prediction}</td>
          <td>${(log.confidence * 100).toFixed(2)}%</td>
          <td>${log.user_ip}</td>
          <td><button class="${buttonClass}" onclick="${actionFunc}('${
              log.user_ip
            }')">${buttonLabel}</button></td>
        </tr>`;
            table.innerHTML += row;
          });
        } catch (err) {
          console.error("Error fetching logs:", err);
        }
      }

      async function blockUser(ip) {
        try {
          const res = await fetch(`/block_user/${ip}`, { method: "POST" });
          if (res.ok) {
            alert(`Blocked IP: ${ip}`);
            fetchLogs();
          } else {
            alert("Failed to block IP");
          }
        } catch (err) {
          console.error("Error blocking user:", err);
        }
      }

      async function unblockUser(ip) {
        try {
          const res = await fetch(`/unblock_user/${ip}`, { method: "POST" });
          if (res.ok) {
            alert(`Unblocked IP: ${ip}`);
            fetchLogs();
          } else {
            alert("Failed to unblock IP");
          }
        } catch (err) {
          console.error("Error unblocking user:", err);
        }
      }

      setInterval(fetchLogs, 3000);
      fetchLogs();
    </script>
  </body>
</html>
